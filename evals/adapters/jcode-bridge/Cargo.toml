[package]
name = "jcode-trust-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
jcode-base = { git = "https://github.com/1jehuang/jcode", rev = "c7f487309ad693c61a6b3268132ff2cb2813fced", default-features = false }
jcode-message-types = { git = "https://github.com/1jehuang/jcode", rev = "c7f487309ad693c61a6b3268132ff2cb2813fced" }
jcode-provider-core = { git = "https://github.com/1jehuang/jcode", rev = "c7f487309ad693c61a6b3268132ff2cb2813fced" }
jcode-provider-gemini-runtime = { git = "https://github.com/1jehuang/jcode", rev = "c7f487309ad693c61a6b3268132ff2cb2813fced" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
