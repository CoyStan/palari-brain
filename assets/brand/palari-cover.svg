<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Palari Brain. Memory with a source.</title>
  <desc id="desc">An illustrated journal follows a bicycle preference from blue to a green correction, then deletion. Original dialogue is the source for recall.</desc>
  <rect width="1200" height="460" rx="16" fill="#101528"/>
  <path d="M40 40h1120M40 410h1120" stroke="#394050"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="79" fill="#66E3C4" font-size="15" letter-spacing="3">PALARI / BRAIN</text>
    <text x="49" y="197" fill="#F4EFE5" font-family="Georgia, 'Times New Roman', serif" font-size="100">Memory</text>
    <text x="54" y="259" fill="#F4EFE5" font-size="47">with a source.</text>
    <text x="56" y="333" fill="#B6BECA" font-size="21">A journal for assistants that remember.</text>
    <text x="54" y="438" fill="#B6BECA" font-size="14" letter-spacing="1.5">OPEN SOURCE · LOCAL STORAGE · PROVIDER NEUTRAL</text>
    <path d="M630 109v248" stroke="#6A7382" stroke-width="2"/>
    <circle cx="630" cy="120" r="7" fill="#F4EFE5"/>
    <circle cx="630" cy="220" r="7" fill="#66E3C4"/>
    <circle cx="630" cy="320" r="7" fill="#FF6B5E"/>
    <rect x="653" y="88" width="482" height="82" rx="8" fill="#1C2436" stroke="#394050"/>
    <text x="675" y="113" fill="#B6BECA" font-size="13" letter-spacing="1.7">01 / REMEMBER</text>
    <text x="675" y="145" fill="#F4EFE5" font-size="23">“My bicycle is blue.”</text>
    <rect x="653" y="188" width="482" height="82" rx="8" fill="#1C302F" stroke="#417D70"/>
    <text x="675" y="213" fill="#66E3C4" font-size="13" letter-spacing="1.7">02 / CORRECT</text>
    <text x="675" y="245" fill="#F4EFE5" font-size="23">“Actually, it’s green now.”</text>
    <rect x="653" y="288" width="482" height="82" rx="8" fill="#101528" stroke="#95645F" stroke-dasharray="5 5"/>
    <text x="675" y="313" fill="#FF6B5E" font-size="13" letter-spacing="1.7">03 / FORGET</text>
    <text x="675" y="345" fill="#B6BECA" font-size="23">Evidence removed from memory.</text>
    <text x="1135" y="438" text-anchor="end" fill="#B6BECA" font-size="14" letter-spacing="1.5">ILLUSTRATED JOURNEY</text>
  </g>
</svg>
